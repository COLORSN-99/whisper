name: Verify whisper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run build:files
      - run: npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Unit tests, lint and APK compilation
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleDebugAndroidTest assembleRelease -PunsignedRelease=true
      - name: Allow the ephemeral runner to use its emulator device
        run: sudo chmod a+rw /dev/kvm
      - name: Instrumented tests on an isolated Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            cd android
            ./gradlew --no-daemon connectedDebugAndroidTest
            mkdir -p app/build/screenshots
            adb pull /sdcard/Android/data/io.github.colorsn99.whisper/files/instrumentation-screenshots app/build/screenshots || true
      - name: Test reports and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
            android/app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Unsigned APK for local release signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: whisper-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
