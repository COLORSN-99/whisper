plugins { id 'com.android.application' }

def signingPath = System.getenv('WHISPER_KEYSTORE_FILE')
def signingPassword = System.getenv('WHISPER_SIGNING_PASSWORD')
def signingReady = signingPath && signingPassword
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('assemblerelease') || it.toLowerCase().contains('bundlerelease') } && !signingReady && !project.hasProperty('unsignedRelease')) {
    throw new GradleException('Release signing requires WHISPER_KEYSTORE_FILE and WHISPER_SIGNING_PASSWORD. Use -PunsignedRelease=true only for an intermediate APK to sign locally.')
}

android {
    namespace 'io.github.colorsn99.whisper'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.colorsn99.whisper'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(signingPath)
                storeType 'PKCS12'
                storePassword signingPassword
                keyAlias 'whisper'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            if (signingReady) signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
